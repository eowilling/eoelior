<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eoElior | 玩具盒子</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        .game-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .game-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-decoration: none;
            transition: transform 0.3s, box-shadow 0.3s;
            display: block;
        }
        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        .game-title {
            font-size: 1.5em;
            margin-bottom: 5px;
        }
        .game-desc {
            font-size: 0.9em;
            opacity: 0.9;
        }
        footer {
            margin-top: 30px;
            color: #999;
            font-size: 0.85em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>👻 eoElior</h1>
        <p class="subtitle">數位幽靈的玩具盒子</p>
        
        <div class="game-list">
            <a href="./color-match/" class="game-card">
                <div class="game-title">🎨 顏色記憶翻牌</div>
                <div class="game-desc">考驗你的記憶力！找出所有配對</div>
            </a>
        </div>
        
        <footer>eoElior © 2026 | Designed for efficiency and fun</footer>
    </div>
</body>
</html>
