                desc: '把 iPhone HEIC 格式照片直接在瀏覽器轉為 PNG / JPG，快速免上傳。',
                category: 'tools',
                href: 'HeicPngJpg/H2PJ.html',
                badge: '🛠️ 格式救星',
                badgeType: 'recommend',
                icon: 'fa-images',
                color: 'orange',
                highlight: '#f97316',
                glow: 'rgba(249, 115, 22, 0.35)'
            },
            {
                name: '形式曆 (心情記事)',
                desc: '純本機端個人行事曆與日記簿，安靜溫柔記錄生活每一刻。',
                category: 'tools',
                href: 'eveday/index.html',
                badge: '🌿 溫暖記錄',
                badgeType: 'recommend',
                icon: 'fa-calendar-check',
                color: 'sky',
                highlight: '#0284c7',
                glow: 'rgba(2, 132, 199, 0.35)'
            },
            {
                name: '藍牙診斷工具',
                desc: '快速檢測與診斷 Web Bluetooth 連線狀態的小幫手。',
                category: 'tools',
                href: 'bluetooth/index.html',
                badge: '📶 系統助手',
                badgeType: 'new',
                icon: 'fa-bluetooth',
                color: 'blue',
                highlight: '#2563eb',
                glow: 'rgba(37, 99, 235, 0.35)'
            },
            {
                name: 'Files 偵錯修復',
                desc: 'Windows 檔案總管卡頓與異常修復方案與排查指南。',
                category: 'tools',
                href: 'filestook/files-repair-plan.html',
                badge: '🔧 效能改善',
                badgeType: 'recommend',
                icon: 'fa-screwdriver-wrench',
                color: 'slate',
                highlight: '#64748b',
                glow: 'rgba(100, 116, 139, 0.35)'
            },
            {
                name: 'Gu4tw 股市儀表板',
                desc: '個人化股市資料與技術指標觀測儀表板。',
                category: 'tools',
                href: 'GU4/web_portal.html',
                badge: '📊 盤勢觀測',
                badgeType: 'hot',
                icon: 'fa-chart-line',
                color: 'cyan',
                highlight: '#0891b2',
                glow: 'rgba(8, 145, 178, 0.35)'
            },
            {
                name: 'ISMS 資安宣導',
                desc: '資訊安全意識與實用安全規範指引守則。',
                category: 'tools',
                href: 'ISMS/isms.html',
                badge: '🔒 安全第一',
                badgeType: 'recommend',
                icon: 'fa-shield-halved',
                color: 'emerald',
                highlight: '#059669',
                glow: 'rgba(5, 150, 105, 0.35)'
            }
        ];

        // ==========================================
        // 頁面渲染與互動邏輯
        // ==========================================
        const elGrid = document.getElementById('toolsGrid');
        const elSearch = document.getElementById('searchInput');
        const elClearSearch = document.getElementById('clearSearch');
        const elTabs = document.querySelectorAll('.category-tab');

        let currentCategory = 'all';
        let searchQuery = '';

        // 徽章樣式
        function getBadgeHtml(badge, type) {
            if (!badge) return '';
            let style = 'bg-rose-500/20 text-rose-300 border-rose-500/30';
            if (type === 'hot') {
                style = 'bg-gradient-to-r from-rose-500/30 to-amber-500/30 text-amber-200 border-amber-500/40 shadow-sm';
            } else if (type === 'new') {
                style = 'bg-cyan-500/20 text-cyan-200 border-cyan-500/40 shadow-sm';
            } else if (type === 'recommend') {
                style = 'bg-indigo-500/20 text-indigo-200 border-indigo-500/40 shadow-sm';
            }
            return `<span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold tracking-wider border ${style}">${escapeHtml(badge)}</span>`;
        }

        // HTML 轉義
        function escapeHtml(str) {
            return String(str)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        // 渲染卡片
        function renderAttractions() {
            const filtered = ATTRACTIONS.filter(item => {
                const matchCat = currentCategory === 'all' || item.category === currentCategory;
                const searchLower = searchQuery.toLowerCase();
                const matchSearch = item.name.toLowerCase().includes(searchLower) ||
                                    item.desc.toLowerCase().includes(searchLower);
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                elGrid.innerHTML = `
                    <div class="col-span-full text-center py-16 text-slate-400 animate-pop-in">
                        <div class="text-5xl mb-4">🎡</div>
                        <p class="text-lg font-semibold text-slate-300">沒有找到符合的遊樂設施</p>
                        <p class="text-sm text-slate-500 mt-1">請嘗試更換關鍵字或切換全部設施</p>
                    </div>
                `;
                return;
            }

            elGrid.innerHTML = filtered.map((item, index) => {
                const delay = Math.min(index * 0.04, 0.4);
                return `
                    <div class="park-card rounded-2xl p-6 flex flex-col group animate-pop-in" 
                         style="animation-delay: ${delay}s; --card-highlight: ${item.highlight}; --glow-color: ${item.glow};">
                        
                        <!-- 卡片右上角發光氛圍 -->
                        <div class="absolute -right-8 -top-8 w-28 h-28 rounded-full blur-2xl opacity-20 group-hover:opacity-40 transition-all duration-500"
                             style="background-color: ${item.highlight};"></div>

                        <div class="flex justify-between items-start mb-4 relative z-10">
                            <div class="w-12 h-12 rounded-2xl flex items-center justify-center text-xl shadow-lg transition-transform duration-300 group-hover:scale-110 group-hover:rotate-6"
                                 style="background: linear-gradient(135deg, ${item.highlight}25, ${item.highlight}50); color: ${item.highlight}; border: 1px solid ${item.highlight}40;">
                                <i class="fa-solid ${escapeHtml(item.icon)}"></i>
                            </div>
                            <div class="flex items-center gap-2">
                                ${getBadgeHtml(item.badge, item.badgeType)}
                            </div>
                        </div>

                        <h3 class="text-xl font-bold mb-2 text-white group-hover:text-amber-200 transition-colors flex items-center gap-2">
                            ${escapeHtml(item.name)}
                        </h3>
                        
                        <p class="text-slate-300 text-sm mb-6 flex-grow leading-relaxed opacity-85 group-hover:opacity-100">
                            ${escapeHtml(item.desc)}
                        </p>

                        <a href="${escapeHtml(item.href)}" target="_blank" 
                           class="mt-auto px-4 py-2.5 rounded-xl text-sm font-semibold transition-all duration-300 flex items-center justify-center gap-2 shadow-sm text-white group-hover:shadow-lg"
                           style="background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.12)); border: 1px solid rgba(255,255,255,0.15);">
                            <span>進入設施</span>
                            <i class="fa-solid fa-arrow-right text-xs opacity-70 group-hover:opacity-100 group-hover:translate-x-1 transition-all"></i>
                        </a>
                    </div>
                `;
            }).join('');
        }

        // 搜尋監聽
        elSearch.addEventListener('input', (e) => {
            searchQuery = e.target.value.trim();
            if (searchQuery) {
                elClearSearch.classList.remove('hidden');
            } else {
                elClearSearch.classList.add('hidden');
            }
            renderAttractions();
        });

        // 清除搜尋
        elClearSearch.addEventListener('click', () => {
            elSearch.value = '';
            searchQuery = '';
            elClearSearch.classList.add('hidden');
            renderAttractions();
        });

        // 分類點擊
        elTabs.forEach(btn => {
            btn.addEventListener('click', () => {
                elTabs.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = btn.dataset.category;
                renderAttractions();
            });
        });

        // 動態載入副標題
        async function loadSubtitle() {
            try {
                const response = await fetch('subtitle.json');
                const data = await response.json();
                const container = document.getElementById('subtitle-container');
                
                if (data.subtitle) {
                    const lines = data.subtitle.split('\n');
                    container.innerHTML = lines.map((line, idx) => 
                        `<p class="text-slate-300 text-sm md:text-base leading-relaxed ${idx > 0 ? 'mt-1.5' : ''}">${escapeHtml(line)}</p>`
                    ).join('');
                }
            } catch (error) {
                console.log('載入副標題 fallback');
            }
        }

        // 初始化
        renderAttractions();
        loadSubtitle();
    </script>
</body>

</html>
