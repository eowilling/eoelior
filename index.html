<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eoElior | 玩具盒子</title>
    <link rel="icon" type="image/png" href="assets/raccoon.png">
    
    <!-- Open Graph / Social Media Preview -->
    <meta property="og:title" content="eoElior | GitHub 玩具盒子">
    <meta property="og:description" content="Eeyore 的開發實驗場 - 收集各種有趣的小專案與工具">
    <meta property="og:image" content="https://eowilling.github.io/eoelior/gh-toybox-logo.jpg">
    <meta property="og:url" content="https://eowilling.github.io/eoelior/">
    <meta property="og:type" content="website">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="eoElior | GitHub 玩具盒子">
    <meta name="twitter:description" content="Eeyore 的開發實驗場 - 收集各種有趣的小專案與工具">
    <meta name="twitter:image" content="https://eowilling.github.io/eoelior/gh-toybox-logo.jpg">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Press Start 2P', monospace;
            background: #0a0e27;
            color: #00d4ff;
            min-height: 100vh;
            padding: 20px;
            image-rendering: pixelated;
            background-image: 
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,212,255,0.03) 2px, rgba(0,212,255,0.03) 4px),
                repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0,212,255,0.03) 2px, rgba(0,212,255,0.03) 4px);
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
            border: 4px solid #00d4ff;
            background: #0d1428;
            box-shadow: 8px 8px 0 rgba(0,212,255,0.3);
            position: relative;
        }
        
        .header::before {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            background: linear-gradient(45deg, #4a90ff 0%, #00d4ff 100%);
            z-index: -1;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 15px;
            text-shadow: 3px 3px 0 #4a90ff, 6px 6px 0 #0099ff;
            animation: glitch 3s infinite;
        }
        
        @keyframes glitch {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
        }
        
        .subtitle {
            font-size: 10px;
            color: #66b3ff;
            margin-top: 10px;
        }
        
        .search-box {
            margin-bottom: 30px;
            position: relative;
        }
        
        .search-input {
            width: 100%;
            padding: 15px;
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            background: #0d1428;
            border: 3px solid #00d4ff;
            color: #00d4ff;
            outline: none;
        }
        
        .search-input:focus {
            border-color: #4a90ff;
            box-shadow: 0 0 20px rgba(74,144,255,0.5);
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .tab-btn {
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            padding: 10px 15px;
            background: #0d1428;
            border: 3px solid #00d4ff;
            color: #00d4ff;
            cursor: pointer;
            transition: all 0.1s;
        }
        
        .tab-btn:hover, .tab-btn.active {
            background: #00d4ff;
            color: #0d1428;
            transform: translate(-2px, -2px);
            box-shadow: 2px 2px 0 rgba(0,212,255,0.5);
        }
        
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .project-card {
            background: #0d1428;
            border: 3px solid #00d4ff;
            padding: 15px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        
        .project-card:hover {
            border-color: #4a90ff;
            transform: translate(-4px, -4px);
            box-shadow: 4px 4px 0 #4a90ff;
        }
        
        .project-card h3 {
            font-size: 12px;
            margin-bottom: 10px;
            color: #66b3ff;
        }
        
        .project-card p {
            font-size: 8px;
            line-height: 1.6;
            color: #00d4ff;
            margin-bottom: 10px;
        }
        
        .project-tag {
            display: inline-block;
            font-size: 7px;
            padding: 3px 6px;
            background: #00d4ff;
            color: #0d1428;
            margin-right: 5px;
            margin-top: 5px;
        }
        
        .blink {
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        
        .footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            border-top: 3px dashed #00d4ff;
            font-size: 8px;
            color: #66b3ff;
        }
        
        .pixel-emoji {
            display: inline-block;
            width: 16px;
            height: 16px;
            background: #00d4ff;
            margin: 0 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>▲ eoELIOR ▲</h1>
            <div class="subtitle">[ GitHub 玩具盒子 v1.0 ]</div>
            <div class="subtitle blink" style="margin-top: 5px;">█ PRESS START █</div>
        </div>
        
        <div class="search-box">
            <input type="text" class="search-input" id="searchInput" placeholder="▶ 搜尋專案..." />
        </div>
        
        <div class="tabs">
            <button class="tab-btn active" data-category="all">全部</button>
            <button class="tab-btn" data-category="game">遊戲</button>
            <button class="tab-btn" data-category="tool">工具</button>
            <button class="tab-btn" data-category="fun">趣味</button>
        </div>
        
        <div class="projects-grid" id="projectsGrid">
            <!-- 數獨遊戲 -->
            <div class="project-card" data-category="game" data-url="sudo/index.html">
                <h3>█ 極致數獨 █</h3>
                <p>經典數獨益智遊戲，支援難度選擇、即時驗證、暫停功能</p>
                <span class="project-tag">GAME</span>
                <span class="project-tag">PUZZLE</span>
            </div>
            
            <!-- 輪盤遊戲 -->
            <div class="project-card" data-category="game" data-url="roulette/index.html">
                <h3>█ 幸運輪盤 █</h3>
                <p>自訂選項的幸運轉盤，適合抽獎、選擇困難症救星</p>
                <span class="project-tag">GAME</span>
                <span class="project-tag">RANDOM</span>
            </div>
            
            <!-- 五子棋 -->
            <div class="project-card" data-category="game" data-url="gomoku/index.html">
                <h3>█ 五子棋對戰 █</h3>
                <p>雙人對戰五子棋，支援悔棋、重新開始</p>
                <span class="project-tag">GAME</span>
                <span class="project-tag">PVP</span>
            </div>
            
            <!-- 記憶翻牌 -->
            <div class="project-card" data-category="game" data-url="games/2026-05-06-memory-match/index.html">
                <h3>█ 記憶翻牌 █</h3>
                <p>考驗記憶力的配對遊戲，支援多種難度與計時</p>
                <span class="project-tag">GAME</span>
                <span class="project-tag">MEMORY</span>
            </div>
        </div>
        
        <div class="footer">
            <p>▼▼▼ MADE WITH <span class="blink">♥</span> BY EEYORE ▼▼▼</p>
            <p style="margin-top: 10px;">[ 2026 RETRO EDITION ]</p>
        </div>
    </div>
    
    <script>
        const projects = document.querySelectorAll('.project-card');
        const tabs = document.querySelectorAll('.tab-btn');
        const searchInput = document.getElementById('searchInput');
        
        // 點擊專案卡片
        projects.forEach(card => {
            card.addEventListener('click', () => {
                const url = card.dataset.url;
                if (url) window.location.href = url;
            });
        });
        
        // 分類切換
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                
                const category = tab.dataset.category;
                projects.forEach(project => {
                    if (category === 'all' || project.dataset.category === category) {
                        project.style.display = 'block';
                    } else {
                        project.style.display = 'none';
                    }
                });
            });
        });
        
        // 搜尋功能
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            projects.forEach(project => {
                const title = project.querySelector('h3').textContent.toLowerCase();
                const desc = project.querySelector('p').textContent.toLowerCase();
                
                if (title.includes(query) || desc.includes(query)) {
                    project.style.display = 'block';
                } else {
                    project.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
