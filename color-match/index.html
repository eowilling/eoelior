<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>顏色記憶翻牌 | Color Match</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 20px;
            font-size: 2em;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        .stat { text-align: center; }
        .stat-label { font-size: 0.85em; color: #666; margin-bottom: 5px; }
        .stat-value { font-size: 1.5em; font-weight: bold; color: #667eea; }
        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .card {
            aspect-ratio: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.3s, opacity 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2em;
            color: white;
        }
        .card:hover:not(.flipped):not(.matched) {
            transform: scale(1.05);
        }
        .card.flipped, .card.matched {
            transform: rotateY(180deg);
        }
        .card.matched {
            opacity: 0.5;
            cursor: default;
        }
        .buttons {
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 1em;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
        }
        .modal h2 {
            color: #667eea;
            margin-bottom: 20px;
        }
        .modal p {
            margin: 10px 0;
            font-size: 1.1em;
        }
        @media (max-width: 600px) {
            .container { padding: 20px; }
            h1 { font-size: 1.5em; }
            .card { font-size: 1.5em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 顏色記憶翻牌</h1>
        
        <div class="stats">
            <div class="stat">
                <div class="stat-label">時間</div>
                <div class="stat-value" id="timer">0:00</div>
            </div>
            <div class="stat">
                <div class="stat-label">步數</div>
                <div class="stat-value" id="moves">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">最佳</div>
                <div class="stat-value" id="best">-</div>
            </div>
        </div>

        <div class="game-board" id="board"></div>

        <div class="buttons">
            <button onclick="startGame()">🔄 重新開始</button>
            <button onclick="location.href='../'">🏠 回主頁</button>
        </div>
    </div>

    <div class="modal" id="winModal">
        <div class="modal-content">
            <h2>🎉 恭喜完成！</h2>
            <p>⏱️ 時間：<span id="finalTime"></span></p>
            <p>👟 步數：<span id="finalMoves"></span></p>
            <p id="newRecord" style="color: #667eea; font-weight: bold; display: none;">🏆 新紀錄！</p>
            <button onclick="closeModal(); startGame();" style="margin-top: 20px;">再玩一次</button>
        </div>
    </div>

    <script>
        const colors = ['🔴', '🟠', '🟡', '🟢', '🔵', '🟣', '🟤', '⚫'];
        let cards = [...colors, ...colors];
        let flipped = [];
        let matched = 0;
        let moves = 0;
        let timer = 0;
        let timerInterval;
        let gameStarted = false;

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function startGame() {
            cards = shuffle([...colors, ...colors]);
            flipped = [];
            matched = 0;
            moves = 0;
            timer = 0;
            gameStarted = false;
            clearInterval(timerInterval);
            
            document.getElementById('moves').textContent = '0';
            document.getElementById('timer').textContent = '0:00';
            
            const board = document.getElementById('board');
            board.innerHTML = '';
            
            cards.forEach((color, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.index = index;
                card.dataset.color = color;
                card.textContent = '?';
                card.onclick = () => flipCard(card);
                board.appendChild(card);
            });

            const best = localStorage.getItem('colorMatchBest');
            document.getElementById('best').textContent = best ? best : '-';
        }

        function startTimer() {
            if (!gameStarted) {
                gameStarted = true;
                timerInterval = setInterval(() => {
                    timer++;
                    const mins = Math.floor(timer / 60);
                    const secs = timer % 60;
                    document.getElementById('timer').textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
                }, 1000);
            }
        }

        function flipCard(card) {
            if (flipped.length >= 2 || card.classList.contains('flipped') || card.classList.contains('matched')) {
                return;
            }

            startTimer();
            
            card.classList.add('flipped');
            card.textContent = card.dataset.color;
            flipped.push(card);

            if (flipped.length === 2) {
                moves++;
                document.getElementById('moves').textContent = moves;

                const [card1, card2] = flipped;
                if (card1.dataset.color === card2.dataset.color) {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matched += 2;
                    flipped = [];

                    if (matched === cards.length) {
                        clearInterval(timerInterval);
                        setTimeout(showWinModal, 500);
                    }
                } else {
                    setTimeout(() => {
                        card1.classList.remove('flipped');
                        card2.classList.remove('flipped');
                        card1.textContent = '?';
                        card2.textContent = '?';
                        flipped = [];
                    }, 1000);
                }
            }
        }

        function showWinModal() {
            const mins = Math.floor(timer / 60);
            const secs = timer % 60;
            const timeStr = `${mins}:${secs.toString().padStart(2, '0')}`;
            
            document.getElementById('finalTime').textContent = timeStr;
            document.getElementById('finalMoves').textContent = moves;

            const best = localStorage.getItem('colorMatchBest');
            if (!best || moves < parseInt(best)) {
                localStorage.setItem('colorMatchBest', moves);
                document.getElementById('newRecord').style.display = 'block';
            } else {
                document.getElementById('newRecord').style.display = 'none';
            }

            document.getElementById('winModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('winModal').style.display = 'none';
        }

        window.onload = startGame;
    </script>
</body>
</html>
