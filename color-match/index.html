<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>顏色記憶翻牌 | eoElior</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 20px;
            font-size: 2em;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 10px;
        }
        .stat-item {
            text-align: center;
        }
        .stat-label {
            font-size: 0.85em;
            color: #666;
            margin-bottom: 5px;
        }
        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
        }
        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .card {
            aspect-ratio: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2em;
            position: relative;
            transform-style: preserve-3d;
        }
        .card:hover {
            transform: scale(1.05);
        }
        .card.flipped {
            transform: rotateY(180deg);
        }
        .card.matched {
            opacity: 0.5;
            cursor: default;
        }
        .card.matched:hover {
            transform: none;
        }
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
        }
        .card-front {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 1.5em;
        }
        .card-back {
            transform: rotateY(180deg);
        }
        .buttons {
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        .btn-restart {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-home {
            background: #f5f5f5;
            color: #666;
        }
        .victory {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 10px;
            color: white;
            margin-bottom: 20px;
            display: none;
        }
        .victory.show {
            display: block;
            animation: slideDown 0.5s ease;
        }
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .best-score {
            text-align: center;
            margin-top: 15px;
            color: #666;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🎨 顏色記憶翻牌</h1>
        
        <div class="victory" id="victory">
            <h2>🎉 恭喜過關！</h2>
            <p id="victoryStats"></p>
        </div>
        
        <div class="stats">
            <div class="stat-item">
                <div class="stat-label">時間</div>
                <div class="stat-value" id="timer">0:00</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">步數</div>
                <div class="stat-value" id="moves">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">配對</div>
                <div class="stat-value" id="matched">0/8</div>
            </div>
        </div>
        
        <div class="game-board" id="gameBoard"></div>
        
        <div class="best-score" id="bestScore"></div>
        
        <div class="buttons">
            <button class="btn-restart" onclick="restartGame()">🔄 重新開始</button>
            <button class="btn-home" onclick="location.href='../'">🏠 返回首頁</button>
        </div>
    </div>

    <script>
        const colors = ['🔴', '🟠', '🟡', '🟢', '🔵', '🟣', '🟤', '⚫'];
        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;

        function initGame() {
            // 創建卡牌陣列（每個顏色兩張）
            cards = [...colors, ...colors]
                .sort(() => Math.random() - 0.5)
                .map((color, index) => ({
                    id: index,
                    color: color,
                    flipped: false,
                    matched: false
                }));
            
            // 渲染遊戲板
            const board = document.getElementById('gameBoard');
            board.innerHTML = '';
            
            cards.forEach(card => {
                const cardElement = document.createElement('div');
                cardElement.className = 'card';
                cardElement.dataset.id = card.id;
                cardElement.innerHTML = `
                    <div class="card-front">?</div>
                    <div class="card-back">${card.color}</div>
                `;
                cardElement.addEventListener('click', () => flipCard(card.id));
                board.appendChild(cardElement);
            });
            
            // 重置狀態
            flippedCards = [];
            matchedPairs = 0;
            moves = 0;
            timer = 0;
            gameStarted = false;
            
            updateStats();
            document.getElementById('victory').classList.remove('show');
            
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            
            loadBestScore();
        }

        function flipCard(cardId) {
            const card = cards[cardId];
            const cardElement = document.querySelector(`[data-id="${cardId}"]`);
            
            // 檢查是否可以翻牌
            if (card.matched || card.flipped || flippedCards.length >= 2) return;
            
            // 開始計時
            if (!gameStarted) {
                gameStarted = true;
                timerInterval = setInterval(() => {
                    timer++;
                    updateStats();
                }, 1000);
            }
            
            // 翻牌
            card.flipped = true;
            cardElement.classList.add('flipped');
            flippedCards.push(card);
            
            // 檢查配對
            if (flippedCards.length === 2) {
                moves++;
                updateStats();
                
                setTimeout(() => {
                    checkMatch();
                }, 800);
            }
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;
            const card1Element = document.querySelector(`[data-id="${card1.id}"]`);
            const card2Element = document.querySelector(`[data-id="${card2.id}"]`);
            
            if (card1.color === card2.color) {
                // 配對成功
                card1.matched = true;
                card2.matched = true;
                card1Element.classList.add('matched');
                card2Element.classList.add('matched');
                matchedPairs++;
                updateStats();
                
                // 檢查是否完成
                if (matchedPairs === 8) {
                    setTimeout(() => gameComplete(), 500);
                }
            } else {
                // 配對失敗
                card1.flipped = false;
                card2.flipped = false;
                card1Element.classList.remove('flipped');
                card2Element.classList.remove('flipped');
            }
            
            flippedCards = [];
        }

        function updateStats() {
            const minutes = Math.floor(timer / 60);
            const seconds = timer % 60;
            document.getElementById('timer').textContent = 
                `${minutes}:${seconds.toString().padStart(2, '0')}`;
            document.getElementById('moves').textContent = moves;
            document.getElementById('matched').textContent = `${matchedPairs}/8`;
        }

        function gameComplete() {
            clearInterval(timerInterval);
            
            const victory = document.getElementById('victory');
            const minutes = Math.floor(timer / 60);
            const seconds = timer % 60;
            document.getElementById('victoryStats').textContent = 
                `用時 ${minutes}:${seconds.toString().padStart(2, '0')} | ${moves} 步`;
            victory.classList.add('show');
            
            saveBestScore();
        }

        function saveBestScore() {
            const bestScore = localStorage.getItem('colorMatchBest');
            const currentScore = { time: timer, moves: moves };
            
            if (!bestScore || timer < JSON.parse(bestScore).time) {
                localStorage.setItem('colorMatchBest', JSON.stringify(currentScore));
                loadBestScore();
            }
        }

        function loadBestScore() {
            const bestScore = localStorage.getItem('colorMatchBest');
            const bestScoreElement = document.getElementById('bestScore');
            
            if (bestScore) {
                const { time, moves } = JSON.parse(bestScore);
                const minutes = Math.floor(time / 60);
                const seconds = time % 60;
                bestScoreElement.textContent = 
                    `🏆 最佳紀錄：${minutes}:${seconds.toString().padStart(2, '0')} | ${moves} 步`;
            } else {
                bestScoreElement.textContent = '🏆 最佳紀錄：尚未建立';
            }
        }

        function restartGame() {
            initGame();
        }

        // 初始化遊戲
        initGame();
    </script>
</body>
</html>
