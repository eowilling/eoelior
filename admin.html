<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>後台編輯 | eoElior</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            padding: 20px;
        }
        
        .admin-container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 1rem;
            padding: 2rem;
        }
        
        .textarea-box {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 1rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            min-height: 150px;
            resize: vertical;
            font-family: inherit;
            line-height: 1.8;
        }
        
        .textarea-box:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }
        
        .btn {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            padding: 0.75rem 2rem;
            border-radius: 0.5rem;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .preview-box {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 0.5rem;
            padding: 1.5rem;
            margin-top: 1.5rem;
        }
        
        .preview-text {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.8;
            white-space: pre-wrap;
        }
        
        .status {
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            margin-top: 1rem;
            font-size: 0.9rem;
        }
        
        .status.success {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        
        .status.error {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <h1 style="font-size: 2rem; font-weight: 700; margin-bottom: 1rem; background: linear-gradient(135deg, #6366f1, #8b5cf6); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;">
            🔧 後台編輯器
        </h1>
        <p style="color: #94a3b8; margin-bottom: 2rem;">修改首頁副標題文字（按 Enter 換行）</p>
        
        <div>
            <label style="display: block; margin-bottom: 0.5rem; color: #cbd5e1; font-weight: 500;">
                副標題文字
            </label>
            <textarea id="subtitle" class="textarea-box" placeholder="輸入副標題文字，按 Enter 換行"></textarea>
        </div>
        
        <div class="preview-box">
            <h3 style="color: #cbd5e1; font-weight: 600; margin-bottom: 1rem;">📋 即時預覽</h3>
            <div class="preview-text" id="preview"></div>
        </div>
        
        <div style="margin-top: 2rem; display: flex; gap: 1rem; flex-wrap: wrap;">
            <button class="btn" onclick="downloadJSON()" id="saveBtn">💾 下載 JSON 檔案</button>
            <button class="btn" onclick="resetDefault()" style="background: linear-gradient(135deg, #64748b, #475569);">
                🔄 恢復預設
            </button>
        </div>
        
        <div id="status"></div>
        
        <div style="margin-top: 2rem; padding: 1rem; background: rgba(234, 179, 8, 0.1); border-left: 4px solid #eab308; border-radius: 0.5rem;">
            <p style="color: #fcd34d; font-size: 0.9rem; font-weight: 600; margin-bottom: 0.5rem;">
                📖 使用說明
            </p>
            <ol style="color: #fef08a; font-size: 0.85rem; margin-left: 1.5rem; line-height: 1.8;">
                <li>編輯副標題文字</li>
                <li>點擊「💾 下載 JSON 檔案」</li>
                <li>將下載的 <code>subtitle.json</code> 上傳到 GitHub repo 根目錄</li>
                <li>首頁會自動讀取新內容</li>
            </ol>
        </div>
    </div>
    
    <script>
        const DEFAULT_TEXT = `人生就是跌倒了 躺一會也沒關係
這裡是我的遊樂場
雖然沒有摩天輪但至少晚餐吃什麼不用猶豫太久`;
        
        // 從 JSON 載入現有設定
        async function loadConfig() {
            try {
                const response = await fetch('subtitle.json');
                const data = await response.json();
                document.getElementById('subtitle').value = data.subtitle || DEFAULT_TEXT;
            } catch (error) {
                document.getElementById('subtitle').value = DEFAULT_TEXT;
            }
            updatePreview();
        }
        
        // 更新即時預覽
        function updatePreview() {
            const text = document.getElementById('subtitle').value;
            document.getElementById('preview').textContent = text || '(空白)';
        }
        
        // 下載 JSON 檔案
        function downloadJSON() {
            const text = document.getElementById('subtitle').value;
            const data = { subtitle: text };
            const json = JSON.stringify(data, null, 2);
            
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'subtitle.json';
            a.click();
            URL.revokeObjectURL(url);
            
            showStatus('✅ 檔案已下載！請上傳到 GitHub repo 根目錄', 'success');
        }
        
        // 恢復預設
        function resetDefault() {
            document.getElementById('subtitle').value = DEFAULT_TEXT;
            updatePreview();
        }
        
        // 顯示狀態訊息
        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.className = `status ${type}`;
            statusDiv.textContent = message;
            
            setTimeout(() => {
                statusDiv.className = '';
                statusDiv.textContent = '';
            }, 5000);
        }
        
        // 監聽輸入變化
        document.getElementById('subtitle').addEventListener('input', updatePreview);
        
        // 頁面載入時讀取設定
        loadConfig();
    </script>
</body>
</html>
